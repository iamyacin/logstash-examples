# PostgreSQL -> Elasticsearch
#
# The JDBC input runs a SQL query and indexes each row. Credentials and the
# driver path come from environment variables, so nothing sensitive is
# committed. This input polls continuously: press Ctrl+C after the first load.
#
# Run from the repository root:
#   make run EXAMPLE=06-postgres-to-elasticsearch

input {
  jdbc {
    jdbc_connection_string => "jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:dvdrental}"
    jdbc_user => "${PG_USER:logstash}"
    jdbc_password => "${PG_PASSWORD:logstash}"
    jdbc_driver_library => "${JDBC_DRIVER:/usr/share/logstash/drivers/postgresql.jar}"
    jdbc_driver_class => "org.postgresql.Driver"

    statement => "SELECT country_id, country, last_update FROM country ORDER BY country_id"

    # Demo-friendly: start from scratch on every run instead of resuming
    # from the last tracked value.
    clean_run => true
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS:http://localhost:9200}"]
    index => "demo-postgres-countries"
    document_id => "%{country_id}"
  }

  stdout { codec => rubydebug }
}

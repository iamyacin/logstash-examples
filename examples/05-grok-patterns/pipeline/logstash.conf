# Multiple grok patterns -> Elasticsearch
#
# The same file contains application logs and HTTP request lines. Grok tries
# the patterns in order and the first match wins, so one pipeline can handle
# both formats.
#
# Run from the repository root:
#   make run EXAMPLE=05-grok-patterns

input {
  file {
    path => "${EXAMPLE_DIR:/example}/data/sample.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    exit_after_read => true
  }
}

filter {
  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:time} %{LOGLEVEL:logLevel} %{GREEDYDATA:logMessage}",
        "%{IP:clientIP} %{WORD:httpMethod} %{URIPATH:requestPath}"
      ]
    }
  }

  date {
    match => ["time", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    remove_field => ["message", "time", "path", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS:http://localhost:9200}"]
    index => "demo-grok-patterns"
  }

  stdout { codec => rubydebug }
}

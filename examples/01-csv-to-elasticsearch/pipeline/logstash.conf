# CSV -> Elasticsearch
#
# Reads a MovieLens-style tags file, parses the columns, converts numeric
# fields and uses the Unix timestamp as @timestamp.
#
# Run from the repository root:
#   make run EXAMPLE=01-csv-to-elasticsearch

input {
  file {
    path => "${EXAMPLE_DIR:/example}/data/tags.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    exit_after_read => true
  }
}

filter {
  csv {
    separator => ","
    skip_header => true
    columns => ["userId", "movieId", "tag", "timestamp"]
  }

  mutate {
    convert => {
      "userId" => "integer"
      "movieId" => "integer"
    }
    strip => ["tag"]
  }

  # timestamp is a Unix epoch in seconds, e.g. 1445714994.
  date {
    match => ["timestamp", "UNIX"]
    target => "@timestamp"
  }

  mutate {
    remove_field => ["message", "timestamp", "path", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS:http://localhost:9200}"]
    index => "demo-csv-tags"
  }

  # One dot per event: useful feedback without flooding the terminal.
  stdout { codec => dots }
}

# Apache access log -> Elasticsearch
#
# Parses Combined Log Format lines with the built-in COMBINEDAPACHELOG grok
# pattern, then promotes the Apache timestamp to @timestamp.
#
# Run from the repository root:
#   make run EXAMPLE=02-apache-log-to-elasticsearch

input {
  file {
    path => "${EXAMPLE_DIR:/example}/data/access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    exit_after_read => true
  }
}

filter {
  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
  }

  # Apache format: 30/Apr/2017:04:28:11 +0000
  date {
    match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
    target => "@timestamp"
  }

  # In Logstash 8/9 ECS mode, COMBINEDAPACHELOG emits typed ECS fields such as
  # [http][response][status_code] and [http][response][body][bytes].
  # A "-" byte count is omitted instead of being indexed as a string.
  mutate {
    remove_field => ["message", "timestamp", "path", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS:http://localhost:9200}"]
    index => "demo-apache-logs"
  }

  # One dot per event: useful feedback without flooding the terminal.
  stdout { codec => dots }
}

# Nested JSON arrays -> Elasticsearch
#
# A single document can contain a list of past events. The split filter turns
# every array element into its own Elasticsearch document, and document_id
# makes reruns idempotent (the sample file contains a duplicate parent event).
#
# Run from the repository root:
#   make run EXAMPLE=04-json-arrays-to-elasticsearch

input {
  file {
    path => "${EXAMPLE_DIR:/example}/data/sample-json-split.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    exit_after_read => true
  }
}

filter {
  json {
    source => "message"
  }

  split {
    field => "pastEvents"
  }

  mutate {
    add_field => {
      "eventId" => "%{[pastEvents][eventId]}"
      "transactionId" => "%{[pastEvents][transactionId]}"
    }
    remove_field => ["message", "pastEvents", "path", "host", "@version"]
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    convert => {
      "id" => "integer"
      "eventId" => "integer"
      "age" => "integer"
    }
    remove_field => ["timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS:http://localhost:9200}"]
    index => "demo-json-array-events"
    document_id => "%{id}-%{eventId}"
  }

  stdout { codec => rubydebug }
}

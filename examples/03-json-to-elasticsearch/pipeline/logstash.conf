# JSON lines -> Elasticsearch
#
# Expands the JSON on each line into fields, filters out a payment type and
# uses the event's own timestamp as @timestamp.
#
# Run from the repository root:
#   make run EXAMPLE=03-json-to-elasticsearch

input {
  file {
    path => "${EXAMPLE_DIR:/example}/data/sample-json.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    exit_after_read => true
  }
}

filter {
  json {
    source => "message"
  }

  # Conditional filtering: Mastercard events never reach Elasticsearch.
  if [paymentType] == "Mastercard" {
    drop {}
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    convert => {
      "id" => "integer"
      "age" => "integer"
    }
    remove_field => ["message", "timestamp", "path", "host", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS:http://localhost:9200}"]
    index => "demo-json-payments"
  }

  stdout { codec => rubydebug }
}
